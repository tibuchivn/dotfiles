command_timeout = 500

format = """
$directory\
$git_branch\
$git_state\
$git_status\
$ruby\
$golang\
$kubernetes\
$jobs\
$status\
$cmd_duration\
$time\
$line_break\
$character"""
# Replace the "❯" symbol in the prompt with "➜"
[character]
# success_symbol = "[➜](green)"

[aws]
disabled = true

[ruby]
format = ' [ruby:\($version\)]($style)'
# style = 'red'

[nodejs]
disabled = true
format = '[node:\($version\)]($style)'
style = 'green'

[package]
disabled = true

[gcloud]
disabled = true

[git_branch]
symbol = ''
style = 'blue'

[git_status]
style = 'red'

[time]
disabled = false
format = ' [\[$time\]]($style) '

[cmd_duration]
disabled = true

[docker_context]
disabled = true
